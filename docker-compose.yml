services:
  postgres:
    image: postgres:15-alpine
    container_name: decentrawill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: decentrawill
      POSTGRES_PASSWORD: decentrawill_secure_pass
      POSTGRES_DB: decentrawill
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decentrawill -d decentrawill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: decentrawill-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
